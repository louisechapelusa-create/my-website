<!DOCTYPE html>
<html lang="zh-TW" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ofiii: 免費看短劇 - Google Play 應用程式</title>

<!-- Meta Pixel Code (多像素配置) -->
<script>
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)}(window, document,'script',
'https://connect.facebook.net/en_US/fbevents.js');

// =================【配置区域】=================
// 请在此处替换或添加您的 Facebook Pixel ID
var pixelIds = [
    '1397111069252543', 
];

// 批量初始化所有 Pixel 并发送 PageView 事件
pixelIds.forEach(function(id) {
    if (id && id.indexOf('YOUR_') === -1) {
        fbq('init', id);
    }
});
fbq('track', 'PageView'); // 向所有 Pixel 发送 PageView

// 点击按钮触发完成注册事件的函数
function trackCompleteRegistration(event) {
    // 回传 CompleteRegistration（完成注册）事件给所有 Pixel
    fbq('track', 'CompleteRegistration');
    console.log('FB Pixel: CompleteRegistration tracked for all pixels.');
}

// 页面加载完成后自动绑定所有安装/下载按钮
document.addEventListener('DOMContentLoaded', function() {
    // 选择页面中所有包含“安装”、“下载”或对应按钮类名的元素
    var installButtons = document.querySelectorAll('a, button, .install-btn, [data-action="install"]');
    
    installButtons.forEach(function(btn) {
        btn.addEventListener('click', trackCompleteRegistration);
    });
});
</script>

<!-- Noscript 降级兼容（针对禁用 JS 的浏览器） -->
<noscript>
  <img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=1604853991094779&ev=PageView&noscript=1"/>
</noscript>
<!-- End Meta Pixel Code -->

</head>
<body>

  <!-- 示例按钮：请确保您的落地页安装按钮具备点击响应 -->
  <div style="text-align: center; padding: 50px;">
    <button class="install-btn" style="padding: 15px 30px; font-size: 18px; background-color: #01875f; color: white; border: none; border-radius: 8px; cursor: pointer;">
      安裝 / 下載應用程式
    </button>
  </div>

</body>
</html>
